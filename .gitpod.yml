# Gitpod Configuration for VoxSense Cloud Engine
ports:
  - port: 5000
    name: VoxSense Web Dashboard
    onOpen: open-browser
    visibility: public

tasks:
  - name: Setup & Install Dependencies
    init: |
      python -m venv .venv
      source .venv/bin/activate
      pip install --upgrade pip
      # Install PyTorch CPU version first to minimize memory footprint
      pip install torch --index-url https://download.pytorch.org/whl/cpu
      pip install -r requirements.txt
    command: |
      source .venv/bin/activate
      python server.py
